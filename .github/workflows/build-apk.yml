name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-read-only: false

      - name: Compile & assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/SukainaTube-debug.apk
          ls -lh out

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukainaTube-debug-apk
          path: out/SukainaTube-debug.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/SukainaTube-debug.apk
          name: Sukaina Tube ${{ github.ref_name }}
          body: |
            نسخة تجريبية من تطبيق Sukaina Tube.
            ثبّت الملف `SukainaTube-debug.apk` على هاتف أندرويد (فعّل «تثبيت من مصادر غير معروفة»).
          draft: false
          prerelease: false
